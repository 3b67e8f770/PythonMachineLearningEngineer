name: PySpark CI Pipeline
# 1. WYZWALACZE 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 2. ZADANIA 
jobs:
  build-and-test:
    # 3. ŚRODOWISKO 
    runs-on: ubuntu-latest

    # 4. KROKI 
    steps:
      - name: Pobranie kodu z repozytorium (Checkout)
        uses: actions/checkout@v4

      - name: Instalacja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja bibliotek (Zależności)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie testów
        run: |
          pytest test_process.py
